name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      # Regenerate API types from the committed OpenAPI snapshot and fail if the
      # checked-in types are stale. Refreshing docs/openapi.json from the live
      # API is a separate, deliberate step (see docs/release.md).
      - name: API types drift check
        run: |
          pnpm api:generate
          git diff --exit-code src/api/schema.d.ts
